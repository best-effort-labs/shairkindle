name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Build + sign the release artifact in the same image CI uses, so the
      # published .azw2 is reproducible from exactly this tag.
      - name: Build + sign ShairKindle.azw2
        run: docker compose -f docker/docker-compose.yml run --build --rm build
      - name: Generate SHA256SUMS
        run: |
          test -f kindlet/out/ShairKindle.azw2 || { echo "azw2 missing"; exit 1; }
          ( cd kindlet/out && sha256sum ShairKindle.azw2 > SHA256SUMS && cat SHA256SUMS )
      - name: Publish GitHub Release with the signed .azw2 + checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            kindlet/out/ShairKindle.azw2 kindlet/out/SHA256SUMS \
            --title "shairkindle ${{ github.ref_name }}" \
            --notes "Signed \`ShairKindle.azw2\` for the jailbroken Kindle Keyboard (K3). Verify the download with \`sha256sum -c SHA256SUMS\`. See the README to install and SECURITY.md for the trust model. Experimental software, provided as-is."
