name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Run the host unit suite inside the release image (temurin-8 + build-essential +
      # zig), so CI exercises the exact toolchain a local `docker compose run test` does.
      # --build builds the image first; the 'test' service does `make clean && make check`.
      - name: Host unit tests (in the release image)
        run: docker compose -f docker/docker-compose.yml run --build --rm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Build + sign the real release artifacts so packaging/signing regressions are
      # caught in CI, not at release time. The 'build' service cross-compiles the ARMv6
      # daemon and signs ShairKindle.azw2 (outputs land on the runner via the volume).
      - name: Build + sign release artifacts
        run: docker compose -f docker/docker-compose.yml run --build --rm build
      - name: Verify signed .azw2 + daemon were produced
        run: |
          test -f kindlet/out/ShairKindle.azw2 || { echo "azw2 MISSING"; exit 1; }
          test -f out-armv6/raopd || { echo "raopd MISSING"; exit 1; }
          echo "release artifacts present"
